[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "csprpc"
version = "0.2.0"
description = "Discord Rich Presence for CLIP STUDIO PAINT on macOS and Windows"
readme = "README.md"
requires-python = ">=3.8"
dependencies = []
classifiers = [
  "Environment :: Console",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
]

[project.scripts]
csprpc = "csprpc.cli:main"

[tool.setuptools]
packages = ["csprpc"]
