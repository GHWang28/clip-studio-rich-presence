name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYINSTALLER_ARGS: >-
    --clean --noconfirm
    --paths .
    --collect-submodules csprpc
    --hidden-import csprpc.macos
    --hidden-import csprpc.windows
    --hidden-import csprpc.gui
    --hidden-import tkinter
    --hidden-import tkinter.ttk
    --hidden-import tkinter.messagebox
    --hidden-import tkinter.scrolledtext

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The Windows backend's ctypes calls only ever execute here.
      - name: Run tests
        run: python -m unittest discover -s tests -t . -v

  # Runs on every push but only enforces on a v* tag, so it can gate the
  # build without skipping it on ordinary pushes.
  version:
    name: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag against the declared version
        run: python3 packaging/check_version.py

  build:
    name: build (${{ matrix.artifact }})
    needs: [test, version]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: csprpc-windows
          - os: macos-latest
            artifact: csprpc-macos-arm64
          # macos-13 was retired in December 2025. This is the last Intel
          # image Actions will offer; it goes away in August 2027.
          - os: macos-15-intel
            artifact: csprpc-macos-x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      # Windowed: this is a GUI app, and it means no console flashes up when
      # it starts at login. On macOS it also yields the .app bundle that
      # Finder needs in order to launch it at all.
      - name: Build the app
        shell: bash
        run: |
          set -euo pipefail
          # One .exe is the whole point on Windows. A macOS .app cannot be a
          # single file, and PyInstaller rejects onefile+windowed there.
          if [ "$RUNNER_OS" = "Windows" ]; then MODE=--onefile; else MODE=--onedir; fi
          pyinstaller ${{ env.PYINSTALLER_ARGS }} "$MODE" \
            --name csprpc --windowed packaging/csprpc_entry.py

      - name: Smoke test the app
        shell: bash
        run: |
          set -euo pipefail
          # Drive the CLI through the same binary we ship. Never invoke it
          # bare, which would open the window and hang the job.
          if [ "$RUNNER_OS" = "Windows" ]; then
            BIN=./dist/csprpc.exe
          else
            BIN=./dist/csprpc.app/Contents/MacOS/csprpc
          fi
          export CSPRPC_HOME="$PWD/_smoke"
          "$BIN" --version
          "$BIN" config set client_id 123456789012345678
          "$BIN" config show > /dev/null
          "$BIN" stats
          "$BIN" run --dry-run --once
          # doctor exits non-zero when it finds problems, which is expected on
          # a runner with no Discord and no CLIP STUDIO PAINT.
          "$BIN" doctor || true
          rm -rf "$CSPRPC_HOME"

      # A .app is a directory, so it has to be archived to survive as a
      # release asset at all. A tarball also keeps the execute bit, and
      # extracting with `tar` does not mark the contents quarantined the way
      # unzipping in Finder does, which saves the user two commands.
      - name: Package the macOS app
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          tar -czf "${{ matrix.artifact }}.tar.gz" -C dist csprpc.app
          tar -tzf "${{ matrix.artifact }}.tar.gz" | head -5

      - name: Upload the app
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/csprpc.exe
            ${{ matrix.artifact }}.tar.gz
          if-no-files-found: error
          retention-days: 30

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release files
        run: |
          set -euo pipefail
          mkdir -p release
          cp artifacts/csprpc-windows/csprpc.exe                       release/csprpc.exe
          cp artifacts/csprpc-macos-arm64/csprpc-macos-arm64.tar.gz    release/
          cp artifacts/csprpc-macos-x86_64/csprpc-macos-x86_64.tar.gz  release/
          ls -la release

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A re-run, or a tag made through the web UI, can leave a release
          # already sitting on the tag; attach to it rather than failing.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
